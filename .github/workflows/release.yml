name: Release

# 仅当 main 分支被推送时触发（版本分支合并/推送后）。
# 工作流不会因 workflow 自身推送的 tag 再次触发，因为 filters 只看 branches。
on:
  push:
    branches:
      - main
  # 允许在版本分支上手动试跑，用于发布前验证构建链（真正的发布仍由 push main 触发）。
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: self-hosted

    # 自托管 runner 上必须预先放置游戏/BepInEx 引用 DLL，通过 secrets 传入绝对路径：
    #   GAME_MANAGED  -> 游戏 Managed 目录（Assembly-CSharp.dll、HumanAPI.dll、UnityEngine*.dll 等）
    #   BEPINEX_CORE  -> BepInEx core 目录（BepInEx.dll、BepInEx.Harmony.dll、0Harmony.dll）

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for existing .NET SDK
        id: dotnet-check
        shell: bash
        run: |
          if command -v dotnet >/dev/null 2>&1 && dotnet --version >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "Using machine dotnet:"
            dotnet --info | sed -n '1,20p'
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No usable machine dotnet found; will install a fallback SDK."
          fi

      - name: Setup .NET (fallback)
        if: steps.dotnet-check.outputs.found != 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
        env:
          # Self-hosted runners often cannot write to /usr/share/dotnet.
          # Install the SDK into a writable temp directory when no machine SDK
          # is available.
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$(sed -n 's/.*<Version>\([^<]*\)<\/Version>.*/\1/p' src/TwilightTimer/TwilightTimer.csproj | head -n1 | tr -d '[:space:]')"
          PLUGIN_VERSION="$(sed -n 's/.*PLUGIN_VERSION[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' src/TwilightTimer/PluginInfo.cs | head -n1 | tr -d '[:space:]')"

          if [ -z "$VERSION" ]; then
            echo "::error::Unable to read <Version> from src/TwilightTimer/TwilightTimer.csproj"
            exit 1
          fi

          if [ -z "$PLUGIN_VERSION" ]; then
            echo "::error::Unable to read PLUGIN_VERSION from src/TwilightTimer/PluginInfo.cs"
            exit 1
          fi

          if [ "$VERSION" != "$PLUGIN_VERSION" ]; then
            echo "::error::Version mismatch: csproj=$VERSION, PluginInfo=$PLUGIN_VERSION"
            exit 1
          fi

          # main 分支上不应再出现 dev 占位版本（0.0.0.0）。
          if [ "$VERSION" = "0.0.0.0" ] || [ "$VERSION" = "dev" ]; then
            echo "::error::Refusing to release a non-release version ($VERSION) from main"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Prepare game/BepInEx reference assemblies
        shell: bash
        env:
          GAME_MANAGED: ${{ secrets.GAME_MANAGED }}
          BEPINEX_CORE: ${{ secrets.BEPINEX_CORE }}
        run: |
          set -euo pipefail

          if [ -z "${GAME_MANAGED:-}" ] || [ -z "${BEPINEX_CORE:-}" ]; then
            echo "::error::Missing GAME_MANAGED or BEPINEX_CORE secret. Set both on the self-hosted runner."
            exit 1
          fi

          if [ ! -d "$GAME_MANAGED" ]; then
            echo "::error::GAME_MANAGED is not a directory on this runner: $GAME_MANAGED"
            exit 1
          fi

          if [ ! -d "$BEPINEX_CORE" ]; then
            echo "::error::BEPINEX_CORE is not a directory on this runner: $BEPINEX_CORE"
            exit 1
          fi

          echo "Using GAME_MANAGED=$GAME_MANAGED"
          echo "Using BEPINEX_CORE=$BEPINEX_CORE"
          echo "GAME_MANAGED=$GAME_MANAGED" >> "$GITHUB_ENV"
          echo "BEPINEX_CORE=$BEPINEX_CORE" >> "$GITHUB_ENV"

      # TwilightCore 是编译期硬依赖。工作流自己取一份源码并 Release 构建，不再依赖
      # 自托管 runner 上手工维护的兄弟目录 / 预构建 DLL（旧的 TWILIGHTCORE secret
      # 覆盖路径已废弃）。
      #
      # 默认跟踪 TwilightCore 的 dev 分支：只有它带 TwilightTimer 需要的扩展接口，
      # main 与 tag v1.0.0p 都还没有。要钉死版本时设置仓库变量
      # TWILIGHTCORE_REF=<commit sha 或 tag>，工作流会在日志里打印实际解析出的 commit。
      - name: Fetch and build TwilightCore (hard dependency)
        shell: bash
        env:
          TWILIGHTCORE_REF: ${{ vars.TWILIGHTCORE_REF }}
          TWILIGHTCORE_URL: https://github.com/TwilightCup/TwilightCore.git
        run: |
          set -euo pipefail

          REF="${TWILIGHTCORE_REF:-dev}"
          SRC="$RUNNER_TEMP/TwilightCore"

          rm -rf "$SRC"
          git clone --quiet "$TWILIGHTCORE_URL" "$SRC"
          git -C "$SRC" checkout --quiet --detach "origin/$REF" 2>/dev/null \
            || git -C "$SRC" checkout --quiet --detach "$REF"

          COMMIT="$(git -C "$SRC" rev-parse HEAD)"
          echo "TwilightCore ref=$REF commit=$COMMIT"

          dotnet build "$SRC/TwilightCore.csproj" -c Release

          DLL="$SRC/bin/Release/netstandard2.0/TwilightCore.dll"
          if [ ! -f "$DLL" ]; then
            echo "::error::TwilightCore build produced no DLL at $DLL"
            exit 1
          fi

          # TwilightTimer 编译期依赖这些符号；旧版 TwilightCore 只会让后面的编译
          # 报出难懂的 CS0246/CS0117，这里先把真正的元凶点出来。
          for sym in IResumableTimerProvider IRealtimeTimerProvider ITimerTagProvider GetEnglishLevelName; do
            if ! grep -qa "$sym" "$DLL"; then
              echo "::error::TwilightCore at $COMMIT (ref=$REF) does not provide $sym"
              exit 1
            fi
          done

          echo "TwilightCore.dll verified: $DLL"
          echo "TWILIGHTCORE=$DLL" >> "$GITHUB_ENV"

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          # TWILIGHTCORE is exported by the previous step; pass it explicitly so the
          # csproj's sibling-checkout default can never win.
          dotnet build src/TwilightTimer/TwilightTimer.csproj -c Release \
            -p:TWILIGHTCORE="$TWILIGHTCORE"

      - name: Verify versioned DLL
        shell: bash
        run: |
          set -euo pipefail
          DLL="src/TwilightTimer/bin/Release/netstandard2.0/TwilightTimer-v${{ steps.version.outputs.version }}.dll"
          if [ ! -f "$DLL" ]; then
            echo "::error::Expected build output not found: $DLL"
            exit 1
          fi
          echo "Artifact: $DLL"

      - name: Extract release notes from CHANGELOG
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          notes_file="release-notes.md"

          awk -v ver="## $VERSION" '
            $0 == ver { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > "$notes_file"

          if [ ! -s "$notes_file" ]; then
            echo "::error::No CHANGELOG entry found for version $VERSION"
            exit 1
          fi

          echo "Extracted release notes from CHANGELOG.md for $VERSION"

      - name: Create and push version tag
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists; skipping creation."
          else
            git tag -a "$TAG" -m "TwilightTimer ${{ steps.version.outputs.version }}"
            git push origin "$TAG"
            echo "Pushed tag $TAG."
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: TwilightTimer v${{ steps.version.outputs.version }}
          body_path: release-notes.md
          files: |
            src/TwilightTimer/bin/Release/netstandard2.0/TwilightTimer-v${{ steps.version.outputs.version }}.dll
          fail_on_unmatched_files: true
